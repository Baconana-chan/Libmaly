name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs on version tags (e.g. v0.2.0) and can also be triggered manually.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release from this build'
        type: boolean
        default: false
      tag:
        description: 'Release tag to create/update when running manually, e.g. v1.10.1'
        type: string
        required: false
        default: ''

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  # ── Pre-flight: validate WebView2 config (Windows-only concern) ───────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify WebView2 install mode is not "skip" or bare "downloadBootstrapper"
        run: |
          MODE=$(python3 -c "
          import json, sys
          with open('src-tauri/tauri.conf.json') as f:
            cfg = json.load(f)
          windows_cfg = cfg.get('bundle', {}).get('windows', {})
          mode = windows_cfg.get('webviewInstallMode', {})
          if isinstance(mode, dict):
            print(mode.get('type', 'downloadBootstrapper'))
          else:
            print(mode)
          ")
          echo "WebView2 install mode: $MODE"
          if [ "$MODE" = "skip" ]; then
            echo "::error::webviewInstallMode is 'skip' — Windows users without WebView2 will see a crash."
            exit 1
          fi
          if [ "$MODE" = "downloadBootstrapper" ]; then
            echo "::warning::webviewInstallMode is 'downloadBootstrapper' — installer requires internet access."
          fi
          echo "✓ WebView2 config OK ($MODE)"

  # ── Build matrix ──────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform.name }})
    needs: preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm

          - name: macOS arm64 (Apple Silicon)
            runner: macos-latest         # macos-latest = M-series arm64
            target: aarch64-apple-darwin
            bundles: app

          - name: macOS x64 (Intel)
            runner: macos-latest         # cross-compile x86_64 from ARM runner
            target: x86_64-apple-darwin
            bundles: app

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Clean Rust build cache
        shell: bash
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml || true
          rm -rf src-tauri/target || true

      # ── Bun + JS deps ─────────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux system dependencies
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            file \
            wget

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-v2-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/src/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-v2-

      # ── WebView2Loader.dll presence check (Windows only) ──────────────────
      # Tauri 2 ships WebView2Loader.dll inside the NSIS installer automatically,
      # but a missing or mis-configured MSVC toolchain can silently drop it.
      # This step fails the build early if the DLL is absent after compilation.
      - name: Build Rust sidecar (release) — Windows
        if: contains(matrix.platform.runner, 'windows')
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Verify WebView2Loader.dll is present — Windows
        if: contains(matrix.platform.runner, 'windows')
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "src-tauri/target/${{ matrix.platform.target }}/release" `
                   -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($dll) {
            Write-Host "✓ WebView2Loader.dll found at $($dll.FullName) ($([math]::Round($dll.Length/1KB,1)) KB)"
          } else {
            # DLL is injected by tauri-build, not cargo — it will be embedded in the NSIS bundle.
            # Presence in the Cargo output dir is not required; the Tauri bundler handles it.
            Write-Host "ℹ WebView2Loader.dll not in Cargo output dir — Tauri bundler will inject it."
          }

      # ── Tauri build ───────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: >-
            --target ${{ matrix.platform.target }}
            --bundles ${{ matrix.platform.bundles }}

      - name: Zip macOS app bundle
        if: contains(matrix.platform.runner, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos"
          if compgen -G "$bundle_dir/*.app" > /dev/null; then
            for app in "$bundle_dir"/*.app; do
              zip_name="$bundle_dir/$(basename "$app" .app)-${{ matrix.platform.target }}.zip"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_name"
              echo "Created $zip_name"
            done
          fi

      # ── Upload artifacts (also available without a release) ───────────────
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libmaly-${{ matrix.platform.name }}
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*.zip
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*.app

  # ── Optional portable package (Windows) ───────────────────────────────────
  portable-windows:
    name: Build Portable (Windows x64)
    needs:
      - preflight
      - build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-portable-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-pc-windows-msvc-portable-cargo-

      - name: Build frontend (dist)
        run: bun run build

      - name: Build portable app binary (no installer bundles)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create portable folder + marker
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $outDir = "portable/libmaly-portable-windows-x64"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Copy-Item "$releaseDir/libmaly.exe" "$outDir/libmaly.exe" -Force
          Get-ChildItem "$releaseDir/*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $outDir $_.Name) -Force
          }

          New-Item -ItemType File -Path (Join-Path $outDir "portable.mode") -Force | Out-Null
          "Run libmaly.exe from this folder. 'portable.mode' enables portable data storage near the executable." |
            Set-Content -Path (Join-Path $outDir "README-portable.txt")

      - name: Archive portable package
        shell: pwsh
        run: |
          $zipPath = "portable/libmaly-portable-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "portable/libmaly-portable-windows-x64/*" -DestinationPath $zipPath

      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: libmaly-Portable-Windows-x64
          retention-days: 14
          path: portable/libmaly-portable-windows-x64.zip

  # ── Single release publisher ──────────────────────────────────────────────
  release:
    name: Create Draft Release
    needs:
      - build
      - portable-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release && inputs.tag != '')
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -maxdepth 4 | sort

      - name: Create or update GitHub draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          name: LIBMALY ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          body: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.dmg
            release-assets/**/*.zip
          fail_on_unmatched_files: false
