[package]
name = "libmaly"
version = "1.10.0"
description = "A personal game library manager"
authors = ["Baconana-chan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "libmaly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-cli = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "json",
    "multipart",
] }
reqwest_cookie_store = "0.8"
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
urlencoding = "2.1.3"
base64 = "0.22.1"
libloading = "0.8"
git2 = { version = "0.19", features = ["vendored-openssl"] }
chrono = "0.4"
async-trait = "0.1"
md5 = "0.7"
rand = "0.8"
sha2 = "0.10"
url = "2"
s3 = { package = "rust-s3", version = "0.37.1", default-features = false, features = ["tokio-rustls-tls"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
regex = "1"
boa_engine = "0.20"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
secp256k1 = { version = "0.29", features = ["rand-std"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi",
    "processthreadsapi",
    "windef",
    "minwindef",
    "handleapi",
    "winbase",
    "pdh",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.52"

[features]
zip-support = []
